architecture: qwen3_moe
benchmark:
  macos_m4:
    commit: HEAD
    device: Mac16,10（Apple M4，4P+6E，16GB）
    note: >-
      GPTQ NEON kernel 落地后 decode 14.9×。归因阶梯 ref 9157 → neon 616 ms/tok
      （3 次取 min，--moe-ssd --moe-expert-cache-slots 4）。generated_ids 在
      ref/neon/neon_mt 三者完全一致。瓶颈已转移到 I/O（61.5%），下一步是异步
      预取而非继续优化计算。详见 docs/optimization_log.md。
    topt_ms: 616
    topt_ref_baseline_ms: 9157
    speedup_vs_ref: 14.9x
    ttft_7tok_ms: 5300
    ttft_ref_baseline_ms: 67100
    mac_per_token: 2.576e9
    io_share_pct: 61.5
    compute_share_pct: 38.5
    expert_ffn_share_pct: 20.1
    qkv_share_pct: 8.1
    lm_head_share_pct: 2.5
    resident_mb: 2884
    offloaded_mb: 14688
    offloaded_tensors: 18432
    measured_at_load_avg: ~5
    cache_slots_sweep_ms_per_tok:
      slots_0: 633
      slots_4_default: 616
      slots_8: 631
      slots_16: 655
      slots_64: 689
      slots_128: 755
      slots_4096: 1126
dtype: gptq4
file: model_qwen3_30b_moe_i4.tqwen
moe:
  num_experts: 128
  num_experts_per_tok: 8
  moe_intermediate_size: 768
  shared_experts: 0
  ssd_offload: true
  expert_cache_slots_default: 4
  expert_cache_slots_note: >-
    默认 4 已实测最优。反直觉：小 cache 更快（slots=4096 慢 1.8×），因为大
    cache 让工作集溢出 CPU cache 反复 thrash，而非命中率问题。测速必须扫
    slots，不能固定大值。见 AGENTS.md 坑 #20。
name: model_qwen3_30b_moe_i4
params:
  full_attention_interval: 0
  head_dim: 128
  hidden_size: 2048
  intermediate_size: 0
  model_type: qwen3_moe
  n_heads: 32
  n_kv_heads: 4
  n_layers: 48
  tied_embeddings: false
  vocab_size: 151936
quantization:
  group_size: 128
  method: gptq
  sym: true
  note: >-
    AutoGPTQ Int4（qweight/qzeros/scales/g_idx 列主序），导出时 repack 成 in-band
    块。router（mlp.gate.weight）与 lm_head 是 fp32，master dtype 是 kGPTQ4——
    matvec 必须按张量自身 dtype 路由（mv_typed），否则 router logits 全错、
    选错专家、输出乱码且不报错。见 AGENTS.md 坑 #19。
recipe:
  matvec_impl: neon
  ops_impl: ref
  note: >-
    GPTQ 归因阶梯 ref → neon → neon_mt。**用 neon**：neon_mt 对 MoE 零收益甚至
    更慢（专家矩阵 [768,2048] 只有 12 个 o_block 给 10 线程，且每 token 1152 次
    fork-join）。f32 侧（router/lm_head）不传播 impl 名，一律 neon_mt_kv_nt——
    GPTQ 的 "neon" 与 f32 的 "neon" 同名但 f32 的是单线程版。见 AGENTS.md 坑 #21/#22。
known_limitations:
  - I/O 占 61.5% 是当前最大单项：需异步预取（Phase B）overlap pread 与计算
  - TTFT 5.3 s / 7 tok：MoE 走逐 token prefill，批量 GEMM 的 gather/scatter 未实现
  - 稀疏加载不开则无法运行：文件 17.16 GB > 物理内存 16 GB
  - 大 cache slots 会把机器推进重度换页（实测 swap used 11.3 GB / 12 GB），
    此后所有计时不可信；cache 应按字节预算而非槽数限界
  - kernel 级多线程对 MoE 无效，需改到 runtime 级专家层并行
  - Metal prefill 拒绝 GPTQ（亚字节布局需专门反量化 kernel），且只覆盖 prefill，
    对 decode 无帮助——不是当前杠杆
  - align_fake_qwen35_moe_model.py 只比 resident vs SSD（两边都是 C++），从不与
    独立参考比——同类 dtype bug 仍可能漏网，需补 numpy 参考前向
size_mb: 17573.1
source: Qwen/Qwen3-30B-A3B-GPTQ-Int4
