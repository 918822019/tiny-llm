architecture: qwen3_moe
benchmark:
  macos_m4:
    commit: HEAD
    device: Mac16,10（Apple M4，4P+6E，16GB）
    note: >-
      GPTQ NEON kernel + embed 卸载 + 保留源 fp16 dtype + B-1 单次 pread +
      B-2 层内异步预取。decode 累计 29.7×、resident -62.6%。logits 与 fp32 版
      逐位一致（CosSim 1.00000000, max|Δ| 0）。decode 已达 NVMe 带宽下限：
      每 token 读 1.682 GB，有效带宽 5.46 GB/s（峰值 84%），理论下限 259 ms/tok，
      距当前仅 49 ms 空间。要再快只能读更少数据。详见 docs/optimization_log.md。
    topt_ms: 308
    topt_ref_baseline_ms: 9157
    speedup_vs_ref: 29.7x
    ttft_7tok_ms: 4687
    ttft_ref_baseline_ms: 67100
    mac_per_token: 2.576e9
    bytes_read_per_token_gb: 1.682
    io_share_pct: 32.8
    compute_share_pct: 67.2
    io_bandwidth_gbps: 5.46
    nvme_peak_utilization_pct: 84
    bandwidth_floor_ms_per_tok: 259
    headroom_to_floor_ms: 49
    resident_mb: 1079
    resident_baseline_mb: 2884
    offloaded_mb: 15282
    offloaded_tensors: 18433
    file_mb: 16362
    measured_at_load_avg: ~3
    b1_single_pread_speedup: 1.47x
    b2_prefetch_speedup: 1.17x
    b2_prefetch_hit_rate_pct: 7
    b2_prefetch_fallback_rate_pct: 70
    batch_prefill_min_n: 16
    batch_prefill_ttft_speedup:
      n8: 0.97x
      n32: 1.21x
      n128: 1.44x
    batch_prefill_io_reduction_pct:
      n8: 75
      n32: 89.5
      n128: 96.3
    cache_slots_sweep_ms_per_tok:
      slots_0: 344
      slots_4_default: 365
dtype: gptq4
file: model_qwen3_30b_moe_i4_fp16.tqwen
moe:
  num_experts: 128
  num_experts_per_tok: 8
  moe_intermediate_size: 768
  shared_experts: 0
  ssd_offload: true
  expert_cache_slots_default: 4
  expert_cache_slots_note: >-
    默认 4 已实测最优。反直觉：小 cache 更快（slots=4096 慢 1.8×），因为大
    cache 让工作集溢出 CPU cache 反复 thrash，而非命中率问题。测速必须扫
    slots，不能固定大值。见 AGENTS.md 坑 #20。
name: model_qwen3_30b_moe_i4
params:
  full_attention_interval: 0
  head_dim: 128
  hidden_size: 2048
  intermediate_size: 0
  model_type: qwen3_moe
  n_heads: 32
  n_kv_heads: 4
  n_layers: 48
  tied_embeddings: false
  vocab_size: 151936
quantization:
  group_size: 128
  method: gptq
  sym: true
  note: >-
    AutoGPTQ Int4（qweight/qzeros/scales/g_idx 列主序），导出时 repack 成 in-band
    块。router（mlp.gate.weight）与 lm_head 是 fp32，master dtype 是 kGPTQ4——
    matvec 必须按张量自身 dtype 路由（mv_typed），否则 router logits 全错、
    选错专家、输出乱码且不报错。见 AGENTS.md 坑 #19。
recipe:
  matvec_impl: neon
  ops_impl: ref
  note: >-
    GPTQ 归因阶梯 ref → neon → neon_mt。**用 neon**：neon_mt 对 MoE 零收益甚至
    更慢（专家矩阵 [768,2048] 只有 12 个 o_block 给 10 线程，且每 token 1152 次
    fork-join）。f32 侧（router/lm_head）不传播 impl 名，一律 neon_mt_kv_nt——
    GPTQ 的 "neon" 与 f32 的 "neon" 同名但 f32 的是单线程版。见 AGENTS.md 坑 #21/#22。
known_limitations:
  - decode 已达 NVMe 带宽下限：每 token 读 1.682 GB @ 5.46 GB/s（峰值 84%），
    理论下限 259 ms/tok，距当前 308 仅 49 ms。要再快只能读更少数据
    （更激进量化 / 按热度常驻高频专家），不是继续优化计算或调度
  - B-2 预取命中率仅 7%、fallbacks 70%：单专家 I/O（0.50 ms）> 单专家计算
    （0.34 ms），预取追不上。故实测 1.17× 远低于预估 1.83×（粒度错配）
  - TTFT 4687 ms / 7 tok：MoE 走逐 token prefill，批量 GEMM 的 gather/scatter 未实现
  - 稀疏加载不开则无法运行：文件 16.36 GB > 物理内存 16 GB
  - lm_head i4 量化不安全：top-1 argmax 一致率仅 75%（greedy 每 4 token 分叉 1 次），
    故默认保留 fp16；--quant-lm-head 仅 opt-in
  - kernel 级多线程对 MoE 无效（1152 fork-join/token）；专家层并行是 runtime 级改动，
    但 I/O 占 32.8%，计算并行收益有限
  - Metal prefill 拒绝 GPTQ（亚字节布局需专门反量化 kernel），且只覆盖 prefill，
    对 decode 无帮助——不是当前杠杆
  - align_fake_qwen35_moe_model.py 只比 resident vs SSD（两边都是 C++），从不与
    独立参考比——同类 dtype bug 仍可能漏网，需补 numpy 参考前向
size_mb: 16362.0
source: Qwen/Qwen3-30B-A3B-GPTQ-Int4
