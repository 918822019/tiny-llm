# tinyqwen 运行时配置（key = value，'#' 为注释）
# 用法：tinyqwen --config tinyqwen.conf ...
# 优先级：CLI 开关 > 本文件 > 默认值。

# matvec kernel 实现：填任意已注册的实现名（实现文件自注册，见 dispatch.h）。
# 报错时会列出所有可用名。实现名在 f32/f16 两个注册表里各自独立注册，
# 按所加载模型的 dtype 解析（f32 模型配 f16 专属实现会报错，反之亦然）。
# f32 注册表（model.tqwen）当前已注册：
#   ref             标量参考（double 累加，默认，正确性基准 + 兜底）
#   double_2_float  内层累加 double→float 的变体（~12% 提速，误差略大）
#   acc4            标量 4 链并行累加（归因阶梯层，~2.4x vs double_2_float）
#   neon_nofma      NEON 向量化但乘加分开（归因阶梯层，仅 arm64 构建）
#   neon            aarch64 NEON SIMD（4 路 FMA 展开，~8x vs ref，仅 arm64 构建）
#   neon_mt         neon + 多线程行切分（常驻线程池，TINYQWEN_MT_THREADS 可调）
#   neon_mt_bal     neon_mt + 自校准加权分块（实测带宽墙下收益≈0，归档）
#   neon_mt_kv      neon_mt + k/v 成对融合（48 次内联小 matvec → 24 次 fork-join）
#   neon_mt_kv_nt   neon_mt_kv + 权重 LDNP 流式加载（阶梯顶层，~10.0 ms/tok，
#                   M5 Pro 实测；fp32 路线当前最快组合）
# f16 注册表（model_f16.tqwen，exporter --dtype f16 导出）当前已注册：
#   ref             f16 标量参考（double 累加，默认，正确性基准 + 兜底）
#   neon_mt_kv_nt   f16 满栈版（NEON fp32 累加 + 线程池 + kv 融合 + LDNP，
#                   ~7-8 ms/tok；权重流量减半，默认线程 8）
# 新增变体无需改本文件，写实现时自注册即可在此选用。
matvec_impl = ref
