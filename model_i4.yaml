# =============================================================================
# model_i4.yaml —— Qwen2.5-0.5B INT4 RTN 量化模型注册表
# =============================================================================
# 文件级别说明：
#   本文件记录 INT4 RTN（Round-To-Nearest，四舍五入）量化模型的元数据。
#   RTN 是最简单的量化方法：将每个 group 内的权重线性映射到 [0, 15] 范围，
#   用 scale 和 zero 参数记录映射关系，权重值用 4-bit 整数存储。
#
#   注意：此版本已被 HQQ（Half-Quadratic Quantization）版本取代，
#   保留作为回归基线（regression baseline）。
#
#   lm_head（输出层）保持 FP32（因为 tied embeddings 共享嵌入层权重）。
# =============================================================================

# Model registry: model_i4.tqwen（Qwen2.5-0.5B i4 RTN@128，lm_head fp32）
name: model_i4
architecture: qwen2.5
source: Qwen/Qwen2.5-0.5B
dtype: i4                    # 权重数据类型：INT4（4-bit 整数）
file: model_i4.tqwen
size_mb: 700.6               # 含 lm_head fp32 的 I4 模型总大小

# 模型结构参数
params:
  n_layers: 24               # Transformer 层数
  hidden_size: 896           # 隐藏层维度
  intermediate_size: 4864    # FFN 中间层维度
  n_heads: 14                # Query 注意力头数
  n_kv_heads: 2              # Key/Value 注意力头数（GQA）
  head_dim: 64               # 每个注意力头的维度
  vocab_size: 151936         # 词表大小
  tied_embeddings: true      # 嵌入层和输出层共享权重

# 量化配置（RTN 方法，group_size=128）
quantization:
  method: rtn                # 量化方法：RTN（Round-To-Nearest，四舍五入）
  group_size: 128            # 量化组大小：每 128 个权重共享一组 scale/zero
  lm_head_quantized: false   # lm_head 保持 FP32（不量化）
  note: min-max 非对称 RTN（wip 初始版，verify 脚本有 bug 已修）

# 推荐的计算配方：NEON 单线程（初始版本）
recipe:
  matvec_impl: neon          # 矩阵乘：NEON nibble unpack + fmla
  ops_impl: neon             # 非 matvec 算子：NEON 向量化
  note: RTN 量化对照（已被 HQQ 版取代，保留作回归基线）

# 基准测试结果
benchmark:
  android:
    topt_ms: 73.31           # 每个 token 生成时间（较慢，lm_head fp32 占 26.6% 时间）
    ttft_ms: 1223.46         # 首个 token 时间
    peak_rss_mb: 718.4       # 峰值内存占用
    device: PLK110
    commit: 54d05f4+
    note: i4 neon 单线程（lm_head fp32，占 26.6% 时间）
