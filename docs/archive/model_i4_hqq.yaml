# =============================================================================
# model_i4_hqq.yaml —— Qwen2.5-0.5B INT4 HQQ 量化模型注册表
# =============================================================================
# 文件级别说明：
#   本文件记录 INT4 HQQ（Half-Quadratic Quantization）量化模型的元数据。
#   HQQ 是一种基于 MSE（均方误差）最优化的量化方法，相比 RTN 的简单
#   四舍五入，HQQ 在给定 group_size 下能最小化量化误差。
#
#   与 RTN@128 相比，HQQ@64 实现了 -28% 的 MSE 降低。
#   lm_head 保持 FP32（因为 tied embeddings 共享嵌入层权重）。
# =============================================================================

# Model registry: model_i4_hqq.tqwen（Qwen2.5-0.5B i4 HQQ@64，lm_head fp32）
name: model_i4_hqq
architecture: qwen2.5
source: Qwen/Qwen2.5-0.5B
dtype: i4                    # 权重数据类型：INT4
file: model_i4_hqq.tqwen
size_mb: 711.6               # 比 RTN@128 略大（group_size 更小，参数更多）

# 模型结构参数
params:
  n_layers: 24               # Transformer 层数
  hidden_size: 896           # 隐藏层维度
  intermediate_size: 4864    # FFN 中间层维度
  n_heads: 14                # Query 注意力头数
  n_kv_heads: 2              # Key/Value 注意力头数（GQA）
  head_dim: 64               # 每个注意力头的维度
  vocab_size: 151936         # 词表大小
  tied_embeddings: true      # 嵌入层和输出层共享权重

# 量化配置（HQQ 方法，group_size=64）
quantization:
  method: hqq                # 量化方法：HQQ（Half-Quadratic Quantization）
  group_size: 64             # 量化组大小：每 64 个权重共享一组 scale/zero
  lm_head_quantized: false   # lm_head 保持 FP32
  note: HQQ MSE 最优（vs RTN -28% MSE），lm_head 仍 fp32（tied embed 共享）

# 推荐的计算配方：NEON 多线程
recipe:
  matvec_impl: neon_mt       # 矩阵乘：NEON + 常驻线程池行切分
  ops_impl: neon             # 非 matvec 算子：NEON 向量化
  note: i4 HQQ + neon_mt 多线程（lm_head f32 联动），Mac 甜蜜点 8 线程

# 基准测试结果
benchmark:
  android:
    topt_ms: 44.72           # 每个 token 生成时间
    ttft_ms: 1078.09         # 首个 token 时间
    peak_rss_mb: 791.4       # 峰值内存占用
    pmu_dram_bw_gbps: 6.02   # DRAM 带宽（比 f16 的 29.6 低很多 — 算力瓶颈）
    device: PLK110
    commit: 54d05f4+
    note: 比 f16 满栈(17-21)慢 2.1×——i4 unpack 算力瓶颈（~3GB/s/核）
