# =============================================================================
# model_qwen35_i4.yaml —— Qwen3.5-0.8B INT4 HQQ 混合架构模型注册表
# =============================================================================
# 文件级别说明：
#   本文件记录 Qwen3.5-0.8B（GDN + Full Attention 3:1 混合架构）INT4 量化
#   模型的元数据。与 model_qwen35_f16 同模型不同精度：
#   i4 权重 422.9MB（含 lm_head i4 副本 143MB）+ embed fp32 1017MB。
#
#   每 token 权重流量 ≈ 423MB，是 f16（1435MB）的 29%。
#   M4 实测 sdot3_mt 10.53 ms/tok（f16 满栈 17.87 → 1.70× 更快）。
# =============================================================================

# Model registry: model_qwen35_i4.tqwen（Qwen3.5-0.8B i4 HQQ@64 + lm_head i4）
name: model_qwen35_i4
architecture: qwen3.5
source: Qwen/Qwen3.5-0.8B
dtype: i4
file: model_qwen35_i4.tqwen
size_mb: 1375.3              # i4 422.9MB + embed fp32 1019MB

# 模型结构参数（与 model_qwen35_f16.yaml 一致）
params:
  n_layers: 24
  hidden_size: 1024
  intermediate_size: 3584
  n_heads: 8
  n_kv_heads: 2
  head_dim: 256
  vocab_size: 248320
  tied_embeddings: true
  model_type: qwen3_5
  full_attention_interval: 4
  attn_output_gate: true

# GDN 层参数
gdn:
  linear_num_qk_heads: 16
  linear_num_v_heads: 16
  linear_qk_head_dim: 128
  linear_v_head_dim: 128
  linear_conv_kernel_dim: 4

# 量化配置
quantization:
  method: hqq
  group_size: 64
  lm_head_quantized: true    # lm_head i4 副本（流量 508→143MB/token）
  note: tied 模型 embed 保持 fp32 lookup；lm_head 独立量化副本

# 推荐的计算配方
recipe:
  matvec_impl: sdot3_mt
  ops_impl: neon
  note: W4A8 SDOT v3 多线程；0.8B 上较 sdot2_mt 收益温和（1.02×，模型小缓存占比低）

# 基准测试结果
benchmark:
  macos_m4:
    topt_ms: 10.53           # decode 中位（同场 2 轮；sdot2_mt 10.74）
    ttft_ms: null
    peak_rss_mb: null
    device: Mac16,10（Apple M4，4P+6E，16GB）
    commit: ea3aba3+
    note: vs f16 满栈 neon_mt_kv_nt 17.87 = 1.70× 更快；有效带宽 ~40GB/s（单核效率受限，见优化日志）
